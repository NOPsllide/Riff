name: Android ARMv7 Debug Build

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build ARMv7 Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload ARMv7 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: riff-armv7-debug-apk
          path: app/build/outputs/apk/debug/*.apk
